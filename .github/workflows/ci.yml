name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" build pip-audit
      - run: ruff check .
      - run: ruff format --check evaluation tests
      - run: python evaluation/validate_dataset.py
      - run: pytest --cov=local_rag_chatbot --cov-report=term-missing --cov-report=xml --cov-fail-under=35
      - name: Build and smoke-test package
        run: |
          python -m build --outdir "$RUNNER_TEMP/package"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/package/*.whl
          cd "$RUNNER_TEMP"
          python -c 'from importlib.resources import files; from local_rag_chatbot import ChatbotEngine; assert files("local_rag_chatbot").joinpath("resources/prompts/master_prompt.json").is_file(); assert files("local_rag_chatbot").joinpath("resources/routing/priorities.json").is_file(); print("package smoke passed")'
      - name: Remove local package before dependency audit
        run: python -m pip uninstall --yes local-rag-chatbot
      - name: Dependency audit (informational while LangChain migration is pending)
        continue-on-error: true
        run: pip-audit --progress-spinner off --skip-editable --strict
