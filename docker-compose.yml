services:
  app:
    build:
      context: .
      args:
        INSTALL_RERANKER: ${INSTALL_RERANKER:-false}
        VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-chroma}
        LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
        EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      # Container-only addresses and paths override the host-oriented .env.
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8000}
      OLLAMA_BASE_URL: http://ollama:11434
      DOCUMENTS_DIR: /app/knowledge-base
      DATA_DIR: /app/data
      WEB_DIR: /app/web
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-chroma}
      CHROMA_DB_DIR: /app/data/rag_data
      ROUTER_STORE_DIR: /app/data/router_data
      CHROMA_TELEMETRY_ENABLED: "FALSE"
      PGVECTOR_DSN: ${PGVECTOR_DSN:-postgresql+psycopg://rag_chatbot:rag_chatbot@postgres:5432/rag_chatbot}
      PGVECTOR_SCHEMA: ${PGVECTOR_SCHEMA:-rag}
      PGVECTOR_TABLE: ${PGVECTOR_TABLE:-vector_documents}
      PGVECTOR_COLLECTION_TABLE: ${PGVECTOR_COLLECTION_TABLE:-vector_collections}
      PGVECTOR_DISTANCE_STRATEGY: ${PGVECTOR_DISTANCE_STRATEGY:-cosine}
      PGVECTOR_INDEX_TYPE: ${PGVECTOR_INDEX_TYPE:-hnsw}
      PGVECTOR_CREATE_EXTENSION: ${PGVECTOR_CREATE_EXTENSION:-true}
      PGVECTOR_CONNECT_MAX_ATTEMPTS: ${PGVECTOR_CONNECT_MAX_ATTEMPTS:-12}
      PGVECTOR_CONNECT_RETRY_SECONDS: ${PGVECTOR_CONNECT_RETRY_SECONDS:-2}
      PGVECTOR_CONNECT_TIMEOUT_SECONDS: ${PGVECTOR_CONNECT_TIMEOUT_SECONDS:-5}
    volumes:
      - ./knowledge-base:/app/knowledge-base:ro
      - rag-data:/app/data

  ollama:
    image: ollama/ollama:0.32.1
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.32.1
    profiles: ["ollama"]
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        until ollama list >/dev/null 2>&1; do
          sleep 2
        done

        llm_provider="$${LLM_PROVIDER:-ollama}"
        embedding_provider="$${EMBEDDING_PROVIDER:-ollama}"
        generation_model="$${GENERATION_MODEL:-llama3.2:3b}"
        embedding_model="$${EMBEDDING_MODEL:-nomic-embed-text}"
        tool_model="$${TOOL_CALLING_MODEL:-$$generation_model}"
        rewriting_model="$${QUERY_REWRITING_MODEL:-$$generation_model}"

        models_to_pull=""
        if [ "$$llm_provider" = "ollama" ]; then
          models_to_pull="$$models_to_pull $$generation_model $$tool_model $$rewriting_model"
        fi
        if [ "$$embedding_provider" = "ollama" ]; then
          models_to_pull="$$models_to_pull $$embedding_model"
        fi

        pulled_models=""
        for model in $$models_to_pull; do
          case " $$pulled_models " in
            *" $$model "*) continue ;;
          esac

          ollama pull "$$model"
          pulled_models="$$pulled_models $$model"
        done

volumes:
  ollama:
  rag-data:
