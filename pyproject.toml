[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-chatbot"
version = "0.1.0"
description = "A local FastAPI-ready RAG chatbot that can run standalone or be embedded in Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor.Katayama" }]
dependencies = [
  "langchain==0.3.30",
  "langchain-community==0.3.27",
  "langchain-core==0.3.85",
  "langchain-text-splitters==0.3.9",
  "langsmith==0.8.18",
  "numpy==1.26.4",
  "python-dotenv==1.2.2",
  "fastapi==0.139.2",
  "uvicorn[standard]==0.51.0",
  "pydantic>=2,<3",
  "pypdf==6.21.4",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
chroma = [
  "chromadb==0.5.0",
]
pgvector = [
  "langchain-postgres==0.0.17",
  "psycopg[binary,pool]>=3,<4",
]
all-vectorstores = [
  "chromadb==0.5.0",
  "langchain-postgres==0.0.17",
  "psycopg[binary,pool]>=3,<4",
]
ollama = [
  "langchain-ollama==0.2.1",
]
openai = [
  "openai>=1.50,<2",
]
dev = [
  "ruff>=0.6,<1",
  "build>=1,<2",
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
rerank = [
  "sentence-transformers==3.4.1",
]
linux-cpu = [
  "torch==2.4.1+cpu",
]

[project.scripts]
local-rag-chatbot = "local_rag_chatbot.server:main"
local-rag-chatbot-ingest = "local_rag_chatbot.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_rag_chatbot = [
  "resources/**/*.json",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
